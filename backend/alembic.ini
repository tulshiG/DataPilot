[alembic]
# path to migration scripts
script_location = app/database/migrations
# Replace 'your_pg_password' with the password you created when installing Postgres
#sqlalchemy.url=postgresql://postgres:admin123@localhost:5432/datapilot_db
sqlalchemy.url = postgresql://placeholder:placeholder@localhost/placeholder
# Logging configuration (Alembic needs this to output details to your terminal)
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
